id: no-hardcoded-secret-php
language: php
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (getenv() / a secret manager)."
rule:
  kind: assignment_expression
  pattern: $NAME = $VALUE
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: encapsed_string
