id: no-console-writeline
language: csharp
severity: error
message: "Use ILogger (LogTrace/LogDebug), not Console output, in production code."
# Scope follows the message: "in production code" — test projects are out of scope. A command-line
# tool, whose output is its product, has this rule switched off (overlays/csharp/language.md §7);
# no project's own paths live in this template.
ignores:
  - "**/*.Tests/**"
  - "**/*.Test/**"
  - "**/*.test/**"
# The type is matched however it is written: Console, System.Console, global::System.Console.
rule:
  any:
    - pattern: Console.WriteLine($$$)
    - pattern: Console.Write($$$)
    - pattern: Console.Error.WriteLine($$$)
    - pattern: Console.Error.Write($$$)
    - pattern: Console.Out.WriteLine($$$)
    - pattern: Console.Out.Write($$$)
    - pattern: System.Console.WriteLine($$$)
    - pattern: System.Console.Write($$$)
    - pattern: System.Console.Error.WriteLine($$$)
    - pattern: System.Console.Error.Write($$$)
    - pattern: System.Console.Out.WriteLine($$$)
    - pattern: System.Console.Out.Write($$$)
    - pattern: global::System.Console.WriteLine($$$)
    - pattern: global::System.Console.Write($$$)
    - pattern: global::System.Console.Error.WriteLine($$$)
    - pattern: global::System.Console.Error.Write($$$)
    - pattern: global::System.Console.Out.WriteLine($$$)
    - pattern: global::System.Console.Out.Write($$$)
