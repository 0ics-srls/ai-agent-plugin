id: no-hardcoded-secret-python
language: python
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (os.environ / a secret manager)."
rule:
  pattern: $NAME = $VALUE
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: string
