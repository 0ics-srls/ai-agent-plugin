id: no-hardcoded-secret-c
language: c
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (getenv / a secret manager)."
rule:
  any:
    - pattern: $TYPE $NAME = $VALUE;
    - pattern:
        context: 'const $TYPE* $NAME = $VALUE;'
        selector: declaration
    - pattern:
        context: '$TYPE* $NAME = $VALUE;'
        selector: declaration
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: string_literal
