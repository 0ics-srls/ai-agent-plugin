; The test runner: a warning is an error; markers and configuration strict; every test has a time
; limit; async tests need no marker. The default run is the fast one, tests/unit; the full run names
; the folder: `pytest tests`.
[pytest]
testpaths = tests/unit
addopts = --strict-markers --strict-config --import-mode=importlib
filterwarnings = error
timeout = 30
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
