id: no-hardcoded-secret-java
language: java
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (System.getenv / a secret manager)."
rule:
  any:
    - pattern: $TYPE $NAME = $VALUE;
    - pattern:
        context: 'class C { $TYPE $NAME = $VALUE; }'
        selector: field_declaration
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: string_literal
