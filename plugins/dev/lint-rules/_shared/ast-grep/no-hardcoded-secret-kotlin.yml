id: no-hardcoded-secret-kotlin
language: kotlin
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (System.getenv / a secret manager)."
rule:
  any:
    - pattern: val $NAME = $VALUE
    - pattern: var $NAME = $VALUE
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: string_literal
