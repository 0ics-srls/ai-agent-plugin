id: no-hardcoded-secret-typescript
language: typescript
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (process.env / a secret manager)."
rule:
  any:
    - pattern: const $NAME = $VALUE
    - pattern: let $NAME = $VALUE
    - pattern: var $NAME = $VALUE
    - pattern: $NAME = $VALUE
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    # An EMPTY string literal is never a secret: it is the "no value yet" initializer, and code that
    # clears a token (`token = '';`) is the opposite of hardcoding one.
    all:
      - kind: string
      - not:
          regex: "^(''|\"\"|``)$"
