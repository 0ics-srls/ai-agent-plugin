id: no-hardcoded-secret-rust
language: rust
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (std::env::var / a secret manager)."
rule:
  pattern: "const $NAME: $TYPE = $VALUE;"
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: string_literal
