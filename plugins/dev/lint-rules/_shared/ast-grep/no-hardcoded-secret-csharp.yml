id: no-hardcoded-secret-csharp
language: csharp
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (Environment.GetEnvironmentVariable / a secret manager)."
# Scope: PRODUCTION code only. Test projects legitimately hold fake credentials for throwaway
# local containers and fixtures asserting that a secret is NOT leaked; flagging those turns the
# rule into noise and teaches people to ignore it.
ignores:
  - "**/*.test/**"
  - "**/*.Test/**"
rule:
  pattern:
    context: '$TYPE $NAME = $VALUE;'
    selector: variable_declaration
constraints:
  NAME:
    # The name must denote the SECRET ITSELF, not the *name of* something secret-adjacent:
    # `StripeTestSecretKeyEnvVar = "STRIPE_TEST_SECRET_KEY"` is an environment-variable NAME — the
    # rule's own recommended fix — and `TokenPrefix = "pair_"` is a token *prefix* label, not a
    # token. Rust regex has no lookaround, so the exclusion is a separate `not`.
    all:
      - regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
      - not:
          regex: "(?i)(envvar|varname|prefix|suffix|headername|claimtype|fieldname|paramname|propertyname)$"
  VALUE:
    kind: string_literal
