id: no-hardcoded-secret-go
language: go
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (os.Getenv / a secret manager)."
rule:
  any:
    - pattern: var $NAME = $VALUE
    - pattern: $NAME := $VALUE
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    has:
      kind: interpreted_string_literal
