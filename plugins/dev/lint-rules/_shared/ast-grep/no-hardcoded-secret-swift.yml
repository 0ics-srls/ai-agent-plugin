id: no-hardcoded-secret-swift
language: swift
severity: error
message: "Do not hardcode secrets; read from env/secret store and fail-fast (ProcessInfo.environment / a secret manager)."
rule:
  any:
    - pattern: let $NAME = $VALUE
    - pattern: var $NAME = $VALUE
constraints:
  NAME:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)"
  VALUE:
    kind: line_string_literal
