id: no-sql-string-concat-php
language: php
severity: error
message: "No SQL built by string concatenation; use parameterized queries (placeholders + bound params)."
rule:
  kind: binary_expression
  pattern: $SQL . $VAR
constraints:
  SQL:
    kind: encapsed_string
    regex: "(?i)(select|insert|update|delete)\\b"
